[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devops-incident-response"
version = "1.0.0"
description = "OpenEnv environment for AI agent training in production incident response"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "OpenEnv Hackathon Team" }
]
keywords = [
    "openenv",
    "reinforcement-learning",
    "devops",
    "incident-response",
    "sre",
    "microservices",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "openai>=1.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "openenv-core>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://huggingface.co/spaces/openenv/devops-incident-response"
Repository = "https://huggingface.co/spaces/openenv/devops-incident-response"
Documentation = "https://huggingface.co/spaces/openenv/devops-incident-response"

[project.scripts]
server = "server.app:main"
devops-incident-server = "server.app:main"

[tool.hatch.build.targets.wheel]
packages = [".", "server", "models.py", "client.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
